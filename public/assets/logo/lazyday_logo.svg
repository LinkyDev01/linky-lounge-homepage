<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- Lazy Day Book Club logo — 모든 라운딩은 1/4 타원호 -->

  <!-- 그린 기둥 -->
  <path d="M 90 235 L 90 65 A 91 95 0 0 1 181 160 L 181 235 Z" fill="#95AC9A"/>

  <!-- 브라운 스우시: 좌측 경계를 오렌지 내부로 겹쳐 넣어(overlap)
       보이는 경계는 위에 그려지는 오렌지 곡선이 정의. 흰 틈 원천 차단 -->
  <path d="M 245 343 L 408 343
           A 86 86 0 0 1 322 433
           L 145 433 L 180 425 L 225 405 L 250 385 L 245 343 Z" fill="#7D5456"/>

  <!-- 오렌지 D (카운터 evenodd 투명) -->
  <path fill-rule="evenodd" fill="#F59936"
        d="M 90 224 L 134 224
           A 129 155 0 0 1 263 379 L 263 383
           A 114 50 0 0 1 149 433 L 138 433
           A 48 48 0 0 1 90 385 Z
           M 139 269 A 85 113 0 0 1 224 382 L 139 382 Z"/>
</svg>
